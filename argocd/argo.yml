apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-argo-application
  namespace: dev
spec:
  project: default

  source:
    repoURL: https://github.com/ramakrishna3114/argo-cd.git
    targetRevision: main
    path: argocd
  destination: 
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
